spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: openid, profile, email
          github:
            client-id: ${GITHUB_OAUTH_CLIENT_ID:placeholder}
            client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:placeholder}
            scope: user:email
          github-repo:
            provider: github
            client-id: ${GITHUB_REPO_CLIENT_ID:placeholder}
            client-secret: ${GITHUB_REPO_CLIENT_SECRET:placeholder}
            scope: repo
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

smriti:
  aes-key: ${SMRITI_AES_KEY}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

gemini:
  api-key: ${GEMINI_API_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
